name: Build Android APK

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_MOBILE: '1'
  VITE_MOBILE_SYNC: '1'
  VITE_API_BASE: ${{ vars.SAATH_ORIGIN }}
  VITE_IMG_BASE: https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/
  VITE_GIF_BASE: https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci
        working-directory: frontend

      - name: Require family server URL
        run: |
          if [ -z "$VITE_API_BASE" ]; then
            echo "Set repository variable SAATH_ORIGIN to your Oracle HTTPS URL (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          echo "Building connected APK against $VITE_API_BASE"

      - run: npm run build
        working-directory: frontend

      - run: npx cap sync android
        working-directory: frontend

      - run: chmod +x gradlew
        working-directory: frontend/android

      - name: Assemble debug and release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon
        working-directory: frontend/android

      - name: Collect APKs under predictable names
        run: |
          set -euo pipefail
          mkdir -p dist-apk
          DEBUG=$(find frontend/android/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          RELEASE=$(find frontend/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$DEBUG"
          test -n "$RELEASE"
          cp "$DEBUG" dist-apk/SAATH-debug.apk
          cp "$RELEASE" dist-apk/SAATH-release-unsigned.apk
          # Debug APK is already signed with the Android debug key and can be sideloaded.
          cp dist-apk/SAATH-debug.apk dist-apk/SAATH.apk
          ls -lh dist-apk

      - name: Sign release APK when a keystore is configured
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/saath.keystore
          ANDROID_HOME=${ANDROID_HOME:-$HOME/Android/Sdk}
          BUILD_TOOLS=$(ls -1d "$ANDROID_HOME"/build-tools/* | tail -n 1)
          "$BUILD_TOOLS"/zipalign -f -p 4 dist-apk/SAATH-release-unsigned.apk /tmp/saath-aligned.apk
          "$BUILD_TOOLS"/apksigner sign \
            --ks /tmp/saath.keystore \
            --ks-pass pass:"$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass pass:"${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}" \
            --out dist-apk/SAATH-release.apk \
            /tmp/saath-aligned.apk
          cp dist-apk/SAATH-release.apk dist-apk/SAATH.apk
          rm -f /tmp/saath.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: SAATH.apk
          path: dist-apk/SAATH.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: saath-apk-bundle
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to a GitHub Release on tags and manual runs
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('apk-{0}', github.run_number) || github.ref_name }}
          name: SAATH Android ${{ github.event_name == 'workflow_dispatch' && format('build {0}', github.run_number) || github.ref_name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          files: |
            dist-apk/SAATH.apk
            dist-apk/SAATH-debug.apk
          generate_release_notes: true
