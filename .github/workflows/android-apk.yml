name: Build Android APK

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_MOBILE: '1'
  VITE_MOBILE_SYNC: '1'
  VITE_API_BASE: ${{ vars.SAATH_ORIGIN }}
  VITE_IMG_BASE: https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/
  VITE_GIF_BASE: https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci
        working-directory: frontend

      - run: test -n "$VITE_API_BASE" || (echo "Set the repository variable SAATH_ORIGIN to your Oracle HTTPS URL before building an APK." && exit 1)

      - run: npm run build
        working-directory: frontend

      - run: npx cap sync android
        working-directory: frontend

      - run: chmod +x gradlew
        working-directory: frontend/android

      - run: ./gradlew assembleDebug assembleRelease --no-daemon
        working-directory: frontend/android

      - uses: actions/upload-artifact@v7
        with:
          name: saath-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: saath-release-unsigned-apk
          path: frontend/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
